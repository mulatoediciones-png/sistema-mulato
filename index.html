<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#A58CF4">
<title>Mulato Admin</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: barra lateral con el logo y las tasas (escritorio) · barra inferior de 5 accesos (teléfono) · contenido en tarjetas */
:root{
  --brand:#A58CF4; --brand-strong:#6B4FD6; --brand-soft:#F1ECFE; --brand-deep:#2E1F66; --on-brand:#FFFFFF;
  --bg:#F7F6FB; --surface:#FFFFFF; --sunk:#F1EFF7; --ink:#17141F; --muted:#686277; --line:#E5E1EF; --line-strong:#D3CDE3;
  --ok:#15803D; --ok-soft:#E3F4E9; --warn:#A35A08; --warn-soft:#FDF1DD; --bad:#C2410C; --bad-soft:#FCE8E0;
  --chart-1:#A58CF4; --chart-2:#6B4FD6; --chart-3:#2E1F66; --chart-4:#D9CCFB; --chart-mute:#CFCADB; --chart-grid:#ECE9F3;
  --shadow:0 1px 2px rgba(46,31,102,.05),0 4px 16px rgba(46,31,102,.06);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-sm:8px; --r:14px; --side:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#B5A0F7; --brand-strong:#B5A0F7; --brand-soft:#2A2246; --brand-deep:#E6DEFF; --on-brand:#17122A;
  --bg:#0F0D15; --surface:#18151F; --sunk:#201C2A; --ink:#EFECF6; --muted:#A39DB3; --line:#2B2737; --line-strong:#3A3449;
  --ok:#5BD38D; --ok-soft:#14301F; --warn:#F0B35A; --warn-soft:#352612; --bad:#F38E6E; --bad-soft:#3A1D15;
  --chart-1:#B5A0F7; --chart-2:#8467E6; --chart-3:#E6DEFF; --chart-4:#4A3D7A; --chart-mute:#4A4458; --chart-grid:#2B2737;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --brand:#B5A0F7; --brand-strong:#B5A0F7; --brand-soft:#2A2246; --brand-deep:#E6DEFF; --on-brand:#17122A;
  --bg:#0F0D15; --surface:#18151F; --sunk:#201C2A; --ink:#EFECF6; --muted:#A39DB3; --line:#2B2737; --line-strong:#3A3449;
  --ok:#5BD38D; --ok-soft:#14301F; --warn:#F0B35A; --warn-soft:#352612; --bad:#F38E6E; --bad-soft:#3A1D15;
  --chart-1:#B5A0F7; --chart-2:#8467E6; --chart-3:#E6DEFF; --chart-4:#4A3D7A; --chart-mute:#4A4458; --chart-grid:#2B2737;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit}
a{color:var(--brand-strong)}
:focus-visible{outline:2px solid var(--brand-strong);outline-offset:2px}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.side .brand{display:block;padding:4px 8px 6px;border:0;background:none;cursor:pointer;text-align:left;border-radius:10px}
.app.setup-mode{grid-template-columns:1fr}.app.setup-mode .side,.app.setup-mode .topbar{display:none!important}.app.setup-mode .wrap{padding:0;max-width:none}
.side .brand img{width:100%;max-width:190px;height:auto;display:block}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong)}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin-bottom:4px}
.ratecard{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--bg)}
.ratecard .rc-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.ratecard .rc-row b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-size:14px}
.ratecard .gap{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;font-weight:700}
.ratecard .gap span:last-child{background:var(--brand-soft);color:var(--brand-strong);padding:2px 8px;border-radius:999px;font-family:var(--f-num);font-weight:500}
.ratecard small{color:var(--muted);font-size:11.5px}
.ratecard .stale{color:var(--warn);font-weight:700}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:28px 64px}
.banner{margin-bottom:16px;padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
main{display:grid;gap:20px}

/* ---------- cabecera de página ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-strong);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:8px 0 0;max-width:68ch;font-size:14.5px}
.monthpick{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.monthpick span{font-weight:700;min-width:140px;text-align:center;text-transform:capitalize;font-size:14px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:999px;background:none;color:var(--ink);cursor:pointer}
.iconbtn:hover:not(:disabled){background:var(--sunk)}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.iconbtn svg{width:18px;height:18px}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g-wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1060px){.g-wide{grid-template-columns:1fr}}

.kpis{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis,.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.kpis.k3>:first-child{grid-column:1/-1}.kpi{padding:14px}.kpi .ico{width:32px;height:32px;margin-bottom:4px}}
@media (max-width:360px){.kpis,.kpis.k3{grid-template-columns:1fr}}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow);min-width:0}
.kpi .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-strong);margin-bottom:8px}
.kpi .ico svg{width:19px;height:19px}
.kpi .lab{font-size:12.5px;font-weight:700;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,2.4vw,27px);font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .val small{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi.hero{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.kpi.hero .ico{background:rgba(255,255,255,.12);color:#fff}
.kpi.hero .lab,.kpi.hero .sub,.kpi.hero .val small{color:rgba(255,255,255,.72)}
:root[data-theme="dark"] .kpi.hero{color:var(--on-brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi.hero{color:var(--on-brand)}
  :root:not([data-theme="light"]) .kpi.hero .lab,:root:not([data-theme="light"]) .kpi.hero .sub,:root:not([data-theme="light"]) .kpi.hero .val small{color:rgba(23,18,42,.7)}
  :root:not([data-theme="light"]) .kpi.hero .ico{background:rgba(23,18,42,.1);color:var(--on-brand)}}
:root[data-theme="dark"] .kpi.hero .lab,:root[data-theme="dark"] .kpi.hero .sub,:root[data-theme="dark"] .kpi.hero .val small{color:rgba(23,18,42,.7)}
:root[data-theme="dark"] .kpi.hero .ico{background:rgba(23,18,42,.1);color:var(--on-brand)}
.goal{height:6px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px;position:relative}
.goal i{display:block;height:100%;background:var(--brand);border-radius:999px}
.goal em{position:absolute;top:-3px;width:2px;height:12px;background:currentColor;opacity:.8}

/* ---------- gráficos ---------- */
.chart{position:relative;width:100%;min-width:0}
.chart.h220{height:220px}.chart.h260{height:260px}.chart.h300{height:300px}
.chart canvas{display:block}
.donut-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
.donut-wrap .legend{flex:1 1 200px}
.donut{flex:none}
.donut{position:relative;width:180px;height:180px}
.donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .center b{font-family:var(--f-display);font-size:26px;font-weight:600}
.donut .center span{font-size:12px;color:var(--muted);font-weight:600}
.legend{display:grid;gap:10px;width:100%}
.legend .li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.legend .li i{width:10px;height:10px;border-radius:3px;flex:none;margin-right:8px}
.legend .li span:first-child{display:flex;align-items:center;color:var(--muted);font-weight:600}
.nochart{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:16px;text-align:center}

/* ---------- tablas ---------- */
.tbl{overflow-x:auto;margin-inline:-20px;padding-inline:20px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:800;border-top:1px solid var(--line-strong);border-bottom:0}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-strong);font-weight:800;font-size:13px;flex:none}
.who strong{display:block;white-space:nowrap}
.who small{color:var(--muted);font-size:12.5px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neu{background:var(--sunk);color:var(--muted)}
.chip.plan{background:var(--brand-soft);color:var(--brand-strong)}

/* ---------- formularios y botones ---------- */
label.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
input,select{font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;width:100%;min-width:0;min-height:44px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--brand-strong);box-shadow:0 0 0 3px var(--brand-soft)}
input[type="number"]{font-family:var(--f-num);font-size:14px}
input.mini{width:96px;min-height:38px;padding:7px 9px;text-align:right}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));align-items:end}
.help{font-weight:500;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;border-radius:10px;padding:10px 16px;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn svg{width:17px;height:17px}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--brand-strong);border-color:var(--brand-strong);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:36px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.wa{color:#128C4A;border-color:color-mix(in srgb,#128C4A 35%,var(--line))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alerts{display:grid;gap:10px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
.alert.warn{background:var(--warn-soft);color:var(--ink)}.alert.warn svg{color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--ink)}.alert.bad svg{color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ink)}.alert.ok svg{color:var(--ok)}
.meter{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-block:10px 6px}
.meter i{display:block;height:100%;background:var(--brand);border-radius:999px}
.meter i.over{background:var(--bad)}
.split{display:grid}
.split .line{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px solid var(--line);font-size:14px}
.split .line:last-child{border-bottom:0}
.split .line.total{border-top:1px solid var(--line-strong);border-bottom:0;font-weight:800;padding-top:12px;margin-top:2px}
.empty{padding:28px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r);display:grid;gap:12px;justify-items:start}
.formula{font-family:var(--f-num);font-size:13px;background:var(--sunk);border-radius:10px;padding:12px 14px;overflow-x:auto;line-height:1.8}
.paybox{display:grid;gap:12px;padding:16px;margin:4px 0;background:var(--brand-soft);border-radius:12px}
.pdetail td{background:transparent!important}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.payrow-done td{opacity:.75}

/* ---------- conexión ---------- */
.setup{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.setup .card{max-width:460px;width:100%;padding:28px;display:grid;gap:18px}
.setup img{width:200px;height:auto}

/* ---------- teléfono ---------- */
.bottomnav{display:none}
.moresheet{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .app.setup-mode .wrap{padding:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;padding:10px 16px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar img{height:28px;width:auto}
  .topbar .rates{display:flex;gap:6px;font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
  .topbar .rates b{color:var(--ink);font-weight:500}
  .wrap{padding-block:20px 110px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav button{display:grid;justify-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;padding:6px 2px;border-radius:10px;min-height:52px;cursor:pointer}
  .bottomnav button svg{width:22px;height:22px}
  .bottomnav button[aria-current="page"]{color:var(--brand-strong);background:var(--brand-soft)}
  .moresheet.open{display:grid;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .moresheet button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:14px;border-radius:10px;font-weight:700;color:var(--ink);font-size:15px;cursor:pointer}
  .moresheet button svg{width:20px;height:20px;color:var(--brand-strong)}
  .head{align-items:flex-start}
  .monthpick{width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="shell">
  <aside class="side" aria-label="Menú principal">
    <button type="button" class="brand" data-tab="resumen" aria-label="Mulato Ediciones, ir al resumen"><img src="assets/logo-480.png" alt="Mulato Ediciones" width="190" height="49"></button>
    <div><div class="nav-label">Operación</div><nav class="nav" id="nav1"></nav></div>
    <div><div class="nav-label">Configuración</div><nav class="nav" id="nav2"></nav></div>
    <div class="ratecard" id="rates"></div>
  </aside>
  <div class="main">
    <header class="topbar"><img src="assets/logo-480.png" alt="Mulato Ediciones" width="108" height="28"><div class="rates" id="ratesMobile"></div></header>
    <div class="wrap">
      <div id="banner"></div>
      <main id="app" aria-live="polite"></main>
    </div>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Navegación"></nav>
<div class="moresheet" id="moresheet"></div>
<div id="toastHost"></div>

<script>

/* ---------- utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2 = new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('es-VE',{maximumFractionDigits:0});
const usd = n => '$' + nf2.format(n || 0);
const usdt = n => nf2.format(n || 0) + ' USDT';
const bs = n => 'Bs ' + nf2.format(n || 0);

const shiftMes = (m, d) => { let [y,mm] = m.split('-').map(Number); mm += d; while (mm < 1) { mm += 12; y--; } while (mm > 12) { mm -= 12; y++; } return y + '-' + String(mm).padStart(2,'0'); };

const soloDigitos = t => { let d = String(t || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '58' + d.slice(1); return d; };

/* ---------- almacenamiento: Google Sheet a través del Apps Script ---------- */
const sortTasas = a => a.sort((x, y) => x.fecha < y.fecha ? 1 : -1);
const sortCli = a => a.sort((x, y) => (x.orden ?? 99) - (y.orden ?? 99) || String(x.nombre).localeCompare(String(y.nombre)));
const PAGOS = ['cm','video','direccion','estrategia','reserva','reinversion'];
const Store = {
  url: '', key: '', busy: 0, q: Promise.resolve(),
  conf(){ try { return JSON.parse(localStorage.getItem('mulato-api') || 'null'); } catch(e) { return null; } },
  async start(){
    const c = this.conf();
    if (!c || !c.url || !c.key) { state.mode = 'setup'; state.loaded = true; render(); return; }
    this.url = c.url; this.key = c.key; state.mode = 'sheet';
    try { const cache = JSON.parse(localStorage.getItem('mulato-cache') || 'null'); if (cache) { this.ingest(cache); state.loaded = true; render(); } } catch(e) {}
    await this.refresh();
    if (!this.timer) {
      this.timer = setInterval(() => { if (document.visibilityState === 'visible' && !this.busy) this.refresh(); }, 120000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !this.busy) this.refresh(); });
    }
  },
  async call(payload){
    const r = await fetch(this.url, { method: 'POST', body: JSON.stringify({ key: this.key, ...payload }) });
    const j = await r.json();
    if (!j.ok) { const e = new Error(j.error || 'error'); e.code = j.error; throw e; }
    return j;
  },
  async refresh(){
    try {
      const j = await this.call({ action: 'all' });
      this.ingest(j.data); state.offline = false;
      try { localStorage.setItem('mulato-cache', JSON.stringify(j.data)); } catch(e) {}
    } catch(e) {
      if (e.code === 'clave') { state.mode = 'setup'; state.setupError = 'La clave no coincide con la del Apps Script.'; }
      else state.offline = true;
    }
    state.loaded = true; scheduleRender();
  },
  ingest(d){
    state.config = d.config && d.config.planes && d.config.planes.length ? d.config : null;
    state.tasas = sortTasas((d.tasas || []).map(t => ({ ...t, bcv: num(t.bcv), usdt: num(t.usdt) })));
    state.clientes = sortCli((d.clientes || []).map(c => ({ ...c, orden: num(c.orden) || 50 })));
    state.cobros = {}; (d.cobros || []).forEach(r => state.cobros[r.id] = r);
    state.gastos = sortTasas((d.gastos || []).map(g => ({ ...g, clienteId: g.clienteId || null })));
    state.nomina = {}; (d.nomina || []).forEach(r => { const pagos = {}; PAGOS.forEach(k => pagos[k] = r[k] === true || String(r[k]).toLowerCase() === 'true'); state.nomina[r.id] = { id: r.id, mes: r.mes, pagos }; });
    if (state.mes < inicioMes()) state.mes = inicioMes();
  },
  /* las escrituras van en fila, una detrás de otra, y la pantalla se actualiza al instante */
  write(payload){
    this.busy++;
    this.q = this.q.then(() => this.call(payload)).catch(async () => {
      toast('No se pudo guardar en el Sheet. Revisa tu conexión; recargué los datos.');
      await this.refresh();
    }).finally(() => { this.busy--; if (!this.busy) this.refresh(); });
    return this.q;
  },
  set(col, id, data){
    this.applyLocal(col, id, data);
    if (col === 'agencia') return this.write({ action: 'config', data });
    const d = col === 'nomina' ? { mes: data.mes, ...data.pagos } : data;
    return this.write({ action: 'set', col, id, data: d });
  },
  del(col, id){ this.applyLocal(col, id, null); return this.write({ action: 'del', col, id }); },
  applyLocal(col, id, data){
    if (col === 'agencia') state.config = data;
    else if (col === 'cobros' || col === 'nomina') { if (data) state[col][id] = { id, ...data }; else delete state[col][id]; }
    else { const arr = state[col].filter(r => r.id !== id); if (data) arr.push({ id, ...data }); state[col] = arr;
      if (col === 'tasas' || col === 'gastos') sortTasas(arr);
      if (col === 'clientes') sortCli(arr); }
    scheduleRender();
  }
};

/* ---------- cálculos ---------- */
const tasa = () => state.tasas[0] || null;
const factor = () => { const t = tasa(); return t ? (t.usdt / t.bcv) : 1; };
const plan = id => C().planes.find(p => p.id === id);
const activos = () => state.clientes.filter(c => c.estado !== 'pausado' && plan(c.plan));
const pautasActivas = () => activos().reduce((s, c) => s + num(plan(c.plan).pautas), 0);
const totalHerr = () => C().herramientas.reduce((s, h) => s + num(h.monto), 0);
const costoPautaVideo = () => num(C().sueldoVideo) / Math.max(1, pautasActivas());
const herrPorCliente = () => totalHerr() / Math.max(1, activos().length);
function costoPlan(p){
  const cm = num(p.cm), video = num(p.pautas) * costoPautaVideo(), mov = num(p.pautas) * num(C().viaticoPauta), herr = herrPorCliente();
  return { cm, video, mov, herr, total: cm + video + mov + herr };
}
const roundUp = (n, step) => Math.ceil(n / Math.max(1, step)) * Math.max(1, step);
function precioPlan(p){
  const cost = costoPlan(p);
  const necesario = cost.total / (1 - num(C().margen) / 100);       // USDT que necesitas recibir para el margen objetivo
  const objetivo = Math.max(necesario, num(p.base));                // nunca por debajo de lo que quieres recibir en USDT
  const recomendado = roundUp(objetivo * factor() * (1 + num(C().colchon) / 100), num(C().redondeo)); // en $ BCV
  const lista = num(p.lista) || recomendado;
  const recibes = lista / factor();                                // USDT reales que te llegan al cobrar la lista a tasa BCV
  const margen = recibes > 0 ? 1 - cost.total / recibes : 0;
  return { cost, necesario, objetivo, recomendado, lista, recibes, margen, bsHoy: tasa() ? lista * tasa().bcv : 0 };
}
const cobroId = (m, cid) => m + '_' + cid;
/* clientes que cuentan en un mes: ya habían empezado, y están activos o pagaron ese mes */
const clientesMes = m => state.clientes.filter(c => plan(c.plan) && (!c.desde || c.desde <= m) && (c.estado !== 'pausado' || !!state.cobros[cobroId(m, c.id)]));
function cobroDe(m, c){
  const r = state.cobros[cobroId(m, c.id)];
  const p = plan(c.plan); const pp = p ? precioPlan(p) : null;
  return { reg: r, montoBCV: r?.montoBCV ?? (pp ? pp.lista : 0), pagado: r?.estado === 'pagado', recibidoUSDT: r?.recibidoUSDT ?? 0 };
}
function resumenMes(m){
  const cl = clientesMes(m);
  let esperadoBCV = 0, esperadoUSDT = 0, cobradoUSDT = 0, base = 0, pendientes = [];
  cl.forEach(c => { const cb = cobroDe(m, c), eq = cb.montoBCV / factor(); esperadoBCV += cb.montoBCV; esperadoUSDT += eq;
    if (cb.pagado) { cobradoUSDT += num(cb.recibidoUSDT); base += num(cb.recibidoUSDT); } else { pendientes.push(c); base += eq; } });
  const cm = cl.reduce((s, c) => s + num(plan(c.plan).cm), 0);
  const video = num(C().sueldoVideo), herr = totalHerr();
  const gm = state.gastos.filter(g => g.mes === m && g.categoria !== 'Herramientas');
  const gastosMov = gm.filter(g => CATS_MOV.includes(g.categoria)).reduce((s, g) => s + num(g.montoUSDT), 0);
  const gastosOtros = gm.filter(g => !CATS_MOV.includes(g.categoria)).reduce((s, g) => s + num(g.montoUSDT), 0);
  const presupuestoMov = pautasActivas() * num(C().viaticoPauta);
  const costos = cm + video + herr + gastosMov + gastosOtros;
  const margenBruto = base - costos;
  return { cl, esperadoBCV, esperadoUSDT, cobradoUSDT, pendientes, cm, video, herr, gastosMov, gastosOtros, presupuestoMov, costos, base, margenBruto, margenPct: base > 0 ? margenBruto / base : 0 };
}

const charts = [];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function destroyCharts(){ while (charts.length) { try { charts.pop().destroy(); } catch(e) {} } }
function chart(id, cfg){
  const el = document.getElementById(id);
  if (!el) return;
  if (!window.Chart) { el.parentElement.innerHTML = '<div class="nochart">El gráfico se mostrará cuando haya conexión a internet.</div>'; return; }
  const ink = css('--ink'), muted = css('--muted'), grid = css('--chart-grid');
  Chart.defaults.font.family = css('--f-body') || 'Manrope, sans-serif';
  Chart.defaults.color = muted;
  const base = {
    responsive: true, maintainAspectRatio: false, animation: matchMedia('(prefers-reduced-motion: reduce)').matches ? false : { duration: 500 },
    plugins: { legend: { labels: { color: muted, boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 3, font: { weight: 600 } } },
      tooltip: { backgroundColor: ink, titleColor: css('--bg'), bodyColor: css('--bg'), padding: 10, cornerRadius: 8, boxPadding: 4, titleFont: { weight: 700 } } },
    scales: {}
  };
  const merged = { ...cfg, options: deepMerge(base, cfg.options || {}) };
  for (const ax of Object.values(merged.options.scales || {})) {
    ax.grid = { color: grid, drawTicks: false, ...(ax.grid || {}) };
    ax.border = { display: false, ...(ax.border || {}) };
    ax.ticks = { color: muted, padding: 8, ...(ax.ticks || {}) };
  }
  charts.push(new Chart(el, merged));
}
function deepMerge(a, b){ const o = { ...a }; for (const k in b) o[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') ? deepMerge(a[k], b[k]) : b[k]; return o; }

/* historial de meses para el gráfico de tendencia */
function historial(m){
  const out = []; let x = inicioMes(); let guard = 0;
  while (x <= m && guard++ < 24) { out.push(x); x = shiftMes(x, 1); }
  return out.slice(-6);
}

const VIEWS = {
  /* ===== RESUMEN ===== */
  resumen(){
    const r = resumenMes(state.mes), cfg = C(), t = tasa();
    const alerts = [];
    if (!t) alerts.push(['bad','No hay tasa cargada. Sin la tasa BCV y USDT del día los precios en bolívares no se pueden calcular.']);
    else if (t.fecha < ayer()) alerts.push(['warn',`La última tasa es del ${t.fecha}. Actualízala antes de cobrar.`]);
    const d = new Date().getDate();
    if (state.mes === mesDe(hoy()) && d >= num(cfg.diaCobro) && r.pendientes.length) alerts.push(['bad',`${r.pendientes.length} cliente(s) sin pagar este mes: ${r.pendientes.map(c => esc(c.nombre)).join(', ')}.`]);
    if (r.gastosMov > r.presupuestoMov && r.presupuestoMov > 0) alerts.push(['bad',`Traslados y pautas van en ${usdt(r.gastosMov)}, por encima del presupuesto de ${usdt(r.presupuestoMov)}. Esa diferencia sale de tu ganancia.`]);
    const bajos = cfg.planes.map(p => [p, precioPlan(p)]).filter(([p, pp]) => pp.lista < pp.recomendado);
    if (bajos.length) alerts.push(['warn', `La brecha subió: ${bajos.length === 1 ? 'un plan quedó' : bajos.length + ' planes quedaron'} por debajo del precio recomendado (${bajos.map(([p, pp]) => `${esc(p.nombre)} $${nf0.format(pp.lista)} → $${nf0.format(pp.recomendado)}`).join(' · ')}).<div style="margin-top:8px"><button class="btn sm" data-go="planes">Revisar precios</button></div>`]);
    if (!alerts.length) alerts.push(['ok','Todo en orden: tasa al día, precios cubren el margen y no hay cobros vencidos.']);
    const usoMov = r.presupuestoMov > 0 ? r.gastosMov / r.presupuestoMov : 0;
    const rep = cfg.reparto, mb = Math.max(0, r.margenBruto);
    const meta = num(cfg.margen) / 100, pctCob = r.base > 0 ? r.cobradoUSDT / r.base : 0;

    // datos de gráficos
    const porPlan = cfg.planes.map(p => ({ n: p.nombre, v: r.cl.filter(c => c.plan === p.id).reduce((s, c) => { const cb = cobroDe(state.mes, c); return s + (cb.pagado ? num(cb.recibidoUSDT) : cb.montoBCV / factor()); }, 0) })).filter(x => x.v > 0);
    const flujo = [
      ['Community', r.cm, '--chart-mute'], ['Video maker', r.video, '--chart-mute'], ['Herramientas', r.herr, '--chart-mute'], ['Traslados', r.gastosMov + r.gastosOtros, '--chart-mute'],
      ['Tu sueldo', mb * rep.direccion / 100, '--chart-2'], ['Estratega', mb * rep.estrategia / 100, '--chart-1'], ['Reserva', mb * rep.reserva / 100, '--chart-3'], ['Reinversión', mb * rep.reinversion / 100, '--chart-4']];
    const meses = historial(state.mes);
    const hist = meses.map(m => resumenMes(m));
    pendingCharts.push(() => {
      chart('cDonut', { type: 'doughnut', data: { labels: ['Cobrado', 'Por cobrar'], datasets: [{ data: [r.cobradoUSDT, Math.max(0, r.base - r.cobradoUSDT)], backgroundColor: [css('--brand-strong'), css('--chart-4')], borderWidth: 0, hoverOffset: 6 }] },
        options: { cutout: '74%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${fmtU(c.parsed)}` } } } } });
      chart('cFlujo', { type: 'bar', data: { labels: flujo.map(f => f[0]), datasets: [{ label: 'USDT', data: flujo.map(f => +f[1].toFixed(2)), backgroundColor: flujo.map(f => css(f[2])), borderRadius: 6, maxBarThickness: 26 }] },
        options: { indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${fmtU(c.parsed.x)} · ${r.base > 0 ? nf0.format(c.parsed.x / r.base * 100) : 0}% del ingreso` } } },
          scales: { x: { ticks: { callback: v => nf0.format(v) } }, y: { grid: { display: false } } } } });
      if (porPlan.length) chart('cPlanes', { type: 'doughnut', data: { labels: porPlan.map(x => x.n), datasets: [{ data: porPlan.map(x => +x.v.toFixed(2)), backgroundColor: [css('--chart-2'), css('--chart-1'), css('--chart-3'), css('--chart-4')], borderWidth: 2, borderColor: css('--surface') }] },
        options: { cutout: '62%', plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => ` ${c.label}: ${fmtU(c.parsed)}` } } } } });
      chart('cHist', { type: 'bar', data: { labels: meses.map(m => nombreMes(m).replace(/ \d+$/, '')), datasets: [
          { type: 'bar', label: 'Ingreso', data: hist.map(h => +h.base.toFixed(2)), backgroundColor: css('--chart-1'), borderRadius: 6, maxBarThickness: 34, order: 2 },
          { type: 'bar', label: 'Costos', data: hist.map(h => +h.costos.toFixed(2)), backgroundColor: css('--chart-mute'), borderRadius: 6, maxBarThickness: 34, order: 3 },
          { type: 'line', label: 'Margen', data: hist.map(h => +h.margenBruto.toFixed(2)), borderColor: css('--brand-deep'), backgroundColor: css('--brand-deep'), pointRadius: 4, pointHoverRadius: 6, tension: .35, order: 1 }] },
        options: { interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom' }, tooltip: tipU }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { callback: v => nf0.format(v) } } } } });
    });
    return `
    ${head('Panel', 'Resumen de ' + nombreMes(state.mes), 'Todo en USDT reales, la moneda con la que pagas al equipo. Los cobros en bolívares se convierten a la tasa USDT del día.', mesPicker())}
    <div class="kpis">
      <div class="kpi hero"><div class="ico">${ICON.margin}</div><span class="lab">Margen del mes</span><span class="val">${pct(r.margenPct)}</span><span class="sub">Meta ${nf0.format(cfg.margen)}% · ${usdt(r.margenBruto)}</span>
        <div class="goal" role="img" aria-label="Margen ${pct(r.margenPct)} contra meta ${nf0.format(cfg.margen)}%"><i style="width:${Math.max(0, Math.min(100, r.margenPct * 100))}%"></i><em style="left:${Math.min(100, meta * 100)}%"></em></div></div>
      ${kpi('in', 'Ingreso esperado', nf2.format(r.esperadoUSDT), 'USDT', `${usd(r.esperadoBCV)} BCV · ${r.cl.length} clientes`)}
      ${kpi('check', 'Cobrado', nf2.format(r.cobradoUSDT), 'USDT', r.pendientes.length ? r.pendientes.length + ' pendiente(s)' : 'Todos pagaron')}
      ${kpi('cost', 'Costos del mes', nf2.format(r.costos), 'USDT', 'Equipo, herramientas y gastos')}
    </div>
    <div class="grid g-wide">
      <section class="card"><div class="card-h"><div><h2>A dónde va cada USDT</h2><p>Costos en gris, reparto del margen en lila. Pasa el cursor para ver el detalle.</p></div></div>
        <div class="chart h300"><canvas id="cFlujo" role="img" aria-label="Distribución del ingreso entre costos y reparto"></canvas></div></section>
      <section class="card"><div class="card-h"><div><h2>Cobranza</h2><p>Día de cobro: ${cfg.diaCobro} de cada mes</p></div></div>
        <div class="donut-wrap"><div class="donut"><canvas id="cDonut" role="img" aria-label="Porcentaje cobrado del mes"></canvas><div class="center"><b>${pct(pctCob)}</b><span>cobrado</span></div></div>
        <div class="legend">
          <div class="li"><span><i style="background:var(--brand-strong)"></i>Cobrado</span><b class="num">${nf2.format(r.cobradoUSDT)}</b></div>
          <div class="li"><span><i style="background:var(--chart-4)"></i>Por cobrar</span><b class="num">${nf2.format(Math.max(0, r.base - r.cobradoUSDT))}</b></div>
          <div class="li"><span>Clientes al día</span><b class="num">${r.cl.length - r.pendientes.length}/${r.cl.length}</b></div>
          <button class="btn sm" data-go="cobros">Ir a cobros</button></div></div></section>
    </div>
    <div class="grid g-wide">
      <section class="card"><div class="card-h"><div><h2>Qué revisar</h2></div></div><div class="alerts">${alerts.map(alertBox).join('')}</div></section>
      <section class="card"><div class="card-h"><div><h2>Traslados y pautas</h2><p>${pautasActivas()} pautas × ${usdt(cfg.viaticoPauta)}</p></div><button class="btn sm" data-go="gastos">${ICON.plus}Gasto</button></div>
        <div class="row" style="justify-content:space-between"><span class="num" style="font-size:18px">${usdt(r.gastosMov)}</span><span class="muted">de ${usdt(r.presupuestoMov)}</span></div>
        <div class="meter" role="img" aria-label="Uso del presupuesto de traslados: ${nf0.format(usoMov * 100)}%"><i class="${usoMov > 1 ? 'over' : ''}" style="width:${Math.min(100, usoMov * 100)}%"></i></div>
        <p class="muted" style="margin:6px 0 0;font-size:13.5px">Ya está incluido en el precio de cada plan. Si te pasas, sale de tu ganancia.</p></section>
    </div>
    <div class="grid g2">
      <section class="card"><div class="card-h"><div><h2>Ingreso por plan</h2><p>USDT del mes</p></div></div>
        <div class="chart h260">${porPlan.length ? '<canvas id="cPlanes" role="img" aria-label="Ingreso por plan"></canvas>' : '<div class="nochart">Sin clientes activos este mes.</div>'}</div></section>
      <section class="card"><div class="card-h"><div><h2>Tendencia</h2><p>Ingreso, costos y margen por mes desde ${nombreMes(inicioMes())}</p></div></div>
        <div class="chart h260"><canvas id="cHist" role="img" aria-label="Ingreso, costos y margen por mes"></canvas></div></section>
    </div>
    <div class="grid g2">
      <section class="card"><div class="card-h"><h2>De dónde sale el dinero</h2></div><div class="split">
        <div class="line"><span>Ingreso del mes${r.pendientes.length ? ' (cobrado + por cobrar)' : ''}</span><span class="num">${usdt(r.base)}</span></div>
        <div class="line"><span>Community manager</span><span class="num">− ${usdt(r.cm)}</span></div>
        <div class="line"><span>Video maker</span><span class="num">− ${usdt(r.video)}</span></div>
        <div class="line"><span>Herramientas</span><span class="num">− ${usdt(r.herr)}</span></div>
        <div class="line"><span>Traslados y pautas</span><span class="num">− ${usdt(r.gastosMov)}</span></div>
        ${r.gastosOtros ? `<div class="line"><span>Otros gastos</span><span class="num">− ${usdt(r.gastosOtros)}</span></div>` : ''}
        <div class="line total"><span>Margen para repartir</span><span class="num">${usdt(r.margenBruto)}</span></div></div></section>
      <section class="card"><div class="card-h"><h2>Reparto del margen</h2><button class="btn sm" data-go="equipo">Ver pagos</button></div><div class="split">
        <div class="line"><span>Tu sueldo · ${rep.direccion}%</span><span class="num">${usdt(mb * rep.direccion / 100)}</span></div>
        <div class="line"><span>Estratega · ${rep.estrategia}%</span><span class="num">${usdt(mb * rep.estrategia / 100)}</span></div>
        <div class="line"><span>Fondo de reserva · ${rep.reserva}%</span><span class="num">${usdt(mb * rep.reserva / 100)}</span></div>
        <div class="line"><span>Reinversión · ${rep.reinversion}%</span><span class="num">${usdt(mb * rep.reinversion / 100)}</span></div></div></section>
    </div>`;
  },

  /* ===== COBROS ===== */
  cobros(){
    const t = tasa(), m = state.mes, cl = clientesMes(m), r = resumenMes(m);
    if (!cl.length) return `${head('Cobros', 'Cobros de ' + nombreMes(m), '', mesPicker())}<div class="empty">Aún no hay clientes activos este mes.<button class="btn pri sm" data-go="clientes">${ICON.plus}Agregar cliente</button></div>`;
    const rows = cl.map(c => {
      const p = plan(c.plan), cb = cobroDe(m, c);
      const bsAmt = t ? cb.montoBCV * t.bcv : 0, eqU = cb.montoBCV / factor();
      const open = state.openPago === c.id;
      const estado = cb.pagado ? `<span class="chip ok">Pagado</span>` : (state.mes === mesDe(hoy()) && new Date().getDate() > num(C().diaCobro) ? `<span class="chip bad">Vencido</span>` : `<span class="chip warn">Pendiente</span>`);
      const recib = cb.pagado ? `<div class="num">${usdt(cb.recibidoUSDT)}</div><div class="muted" style="font-size:12px">${cb.reg.metodo === 'bs' ? bs(cb.reg.montoRecibido) + ' · ' : ''}${esc(cb.reg.fechaPago || '')}</div>` : `<span class="muted">—</span>`;
      return `<tr class="${cb.pagado ? 'payrow-done' : ''}">
        <td><div class="who"><div class="avatar" aria-hidden="true">${esc(initials(c.nombre))}</div><div><strong>${esc(c.nombre)}</strong><small><span class="chip plan plain">${esc(p.nombre)}</span> ${c.pago === 'bs' ? 'Paga en Bs' : 'Paga en USDT'}</small></div></div></td>
        <td class="r num">${usd(cb.montoBCV)}</td>
        <td class="r num">${t ? bs(bsAmt) : '—'}</td>
        <td class="r num">${nf2.format(eqU)}</td>
        <td>${estado}</td>
        <td class="r">${recib}</td>
        <td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">
          ${c.telefono && soloDigitos(c.telefono).length >= 10 ? `<a class="btn sm wa" href="https://wa.me/${soloDigitos(c.telefono)}?text=${encodeURIComponent(msgCobro(c))}" target="_blank" rel="noopener" aria-label="Enviar cobro por WhatsApp a ${esc(c.nombre)}">${ICON.wa}WhatsApp</a>` : ''}
          <button class="btn sm ghost" data-copy="${c.id}" aria-label="Copiar mensaje de cobro para ${esc(c.nombre)}">${ICON.copy}Copiar</button>
          ${cb.pagado ? `<button class="btn sm ghost" data-unpay="${c.id}">Deshacer</button>` : `<button class="btn sm pri" data-openpay="${c.id}">${open ? 'Cerrar' : 'Registrar pago'}</button>`}
        </div></td></tr>
        ${open && !cb.pagado ? `<tr class="pdetail"><td colspan="7">${payForm(c, cb)}</td></tr>` : ''}`;
    }).join('');
    const prog = r.base > 0 ? r.cobradoUSDT / r.base : 0;
    return `
    ${head('Cobros', 'Cobros de ' + nombreMes(m), `Se cobra el día ${C().diaCobro}. El cliente paga el precio en $ BCV: en bolívares a la tasa BCV del día o el equivalente en USDT. Recibes lo mismo por cualquier vía.`, mesPicker())}
    <div class="kpis k3">
      ${kpi('cobros', 'Por cobrar', usd(r.esperadoBCV), 'BCV', t ? bs(r.esperadoBCV * t.bcv) : 'Sin tasa')}
      ${kpi('in', 'Equivale a', nf2.format(r.esperadoUSDT), 'USDT', 'Dinero real que te llega')}
      <div class="kpi"><div class="ico">${ICON.check}</div><span class="lab">Ya cobrado</span><span class="val">${nf2.format(r.cobradoUSDT)}<small>USDT</small></span><span class="sub">${cl.length - r.pendientes.length} de ${cl.length} clientes</span>
        <div class="meter" role="img" aria-label="${pct(prog)} cobrado"><i style="width:${Math.min(100, prog * 100)}%"></i></div></div>
    </div>
    <section class="card"><div class="tbl"><table>
      <thead><tr><th>Cliente</th><th class="r">Precio $ BCV</th><th class="r">En Bs hoy</th><th class="r">En USDT</th><th>Estado</th><th class="r">Recibido</th><th class="r">Acciones</th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>`;
  },

  /* ===== GASTOS ===== */
  gastos(){
    const m = state.mes, cfg = C(), r = resumenMes(m);
    const list = state.gastos.filter(g => g.mes === m);
    const porCat = CATS.map(cat => [cat, list.filter(g => g.categoria === cat).reduce((s, g) => s + num(g.montoUSDT), 0)]).filter(x => x[1] > 0);
    const cliName = id => id === '_' ? 'Sin cliente' : (state.clientes.find(c => c.id === id)?.nombre || 'Cliente borrado');
    const cliPres = id => { const c = state.clientes.find(x => x.id === id); return c && plan(c.plan) ? num(plan(c.plan).pautas) * num(cfg.viaticoPauta) : 0; };
    const usoMov = r.presupuestoMov > 0 ? r.gastosMov / r.presupuestoMov : 0;
    const clientesConPauta = r.cl.map(c => ({ id: c.id, n: c.nombre, pres: cliPres(c.id), gasto: list.filter(g => CATS_MOV.includes(g.categoria) && g.clienteId === c.id).reduce((s, g) => s + num(g.montoUSDT), 0) }));
    const sinCli = list.filter(g => CATS_MOV.includes(g.categoria) && !g.clienteId).reduce((s, g) => s + num(g.montoUSDT), 0);
    if (sinCli) clientesConPauta.push({ id: '_', n: 'Sin cliente', pres: 0, gasto: sinCli });
    pendingCharts.push(() => {
      chart('cGastos', { type: 'bar', data: { labels: clientesConPauta.map(x => x.n), datasets: [
          { label: 'Gastado', data: clientesConPauta.map(x => +x.gasto.toFixed(2)), backgroundColor: clientesConPauta.map(x => x.pres && x.gasto > x.pres ? css('--bad') : css('--brand-strong')), borderRadius: 6, maxBarThickness: 22 },
          { label: 'Presupuesto', data: clientesConPauta.map(x => +x.pres.toFixed(2)), backgroundColor: css('--chart-4'), borderRadius: 6, maxBarThickness: 22 }] },
        options: { indexAxis: 'y', plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmtU(c.parsed.x)}` } } }, scales: { x: { beginAtZero: true, ticks: { callback: v => nf0.format(v) } }, y: { grid: { display: false } } } } });
    });
    return `
    ${head('Gastos', 'Gastos de ' + nombreMes(m), 'Anota cada taxi, gasolina o gasto de pauta con el cliente al que corresponde. Así ves qué cuenta se come el presupuesto de traslados.', mesPicker())}
    <div class="kpis k3">
      <div class="kpi"><div class="ico">${ICON.gastos}</div><span class="lab">Traslados y pautas</span><span class="val">${nf2.format(r.gastosMov)}<small>USDT</small></span><span class="sub">de ${usdt(r.presupuestoMov)} de presupuesto</span>
        <div class="meter"><i class="${usoMov > 1 ? 'over' : ''}" style="width:${Math.min(100, usoMov * 100)}%"></i></div></div>
      ${kpi('cost', 'Otros gastos', nf2.format(r.gastosOtros), 'USDT', 'Fuera de traslados')}
      ${kpi('info', 'Movimientos', String(list.length), '', 'Registrados este mes')}
    </div>
    <section class="card"><div class="card-h"><h2>Nuevo gasto</h2><span class="muted" style="font-size:13px">Bs → USDT a ${tasa() ? nf2.format(tasa().usdt) : 'sin tasa'}</span></div>
      <form class="form" id="gastoForm">
        <label class="f" for="gFecha">Fecha<input id="gFecha" type="date" value="${hoy()}" required></label>
        <label class="f" for="gCat">Tipo<select id="gCat">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
        <label class="f" for="gCli">Cliente<select id="gCli"><option value="">Sin cliente</option>${activos().map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></label>
        <label class="f" for="gMonto">Monto<input id="gMonto" type="number" step="0.01" min="0" inputmode="decimal" required></label>
        <label class="f" for="gMon">Moneda<select id="gMon"><option value="usdt">USDT / $</option><option value="bs">Bolívares</option></select></label>
        <label class="f" for="gNota">Nota<input id="gNota" type="text" placeholder="Ej. taxi a grabación"></label>
        <button class="btn pri" type="submit">${ICON.plus}Agregar gasto</button>
      </form></section>
    <div class="grid g-wide">
      <section class="card"><div class="card-h"><div><h2>Gastado vs. presupuesto por cliente</h2><p>En rojo, los clientes que ya pasaron su presupuesto</p></div></div>
        <div class="chart" style="height:${Math.max(220, clientesConPauta.length * 46 + 60)}px"><canvas id="cGastos" role="img" aria-label="Gasto de traslado por cliente contra su presupuesto"></canvas></div></section>
      <section class="card"><div class="card-h"><h2>Por tipo</h2></div>${porCat.length ? `<div class="split">${porCat.map(([k, v]) => `<div class="line"><span>${k}</span><span class="num">${usdt(v)}</span></div>`).join('')}</div>` : `<p class="muted" style="margin:0">Sin gastos este mes.</p>`}
        <p class="muted" style="font-size:13px;margin:14px 0 0">Las herramientas fijas (${cfg.herramientas.map(h => esc(h.nombre)).join(', ')}) se suman solas cada mes.</p></section>
    </div>
    <section class="card"><div class="card-h"><h2>Movimientos</h2></div>
      ${list.length ? `<div class="tbl"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cliente</th><th>Nota</th><th class="r">Monto</th><th class="r">USDT</th><th></th></tr></thead><tbody>
      ${list.map(g => `<tr><td class="num">${esc(g.fecha)}</td><td>${esc(g.categoria)}</td><td>${esc(g.clienteId ? cliName(g.clienteId) : '—')}</td><td>${esc(g.nota || '')}</td><td class="r num">${g.moneda === 'bs' ? bs(g.montoOriginal) : usd(g.montoOriginal)}</td><td class="r num">${nf2.format(g.montoUSDT)}</td><td class="r"><button class="btn sm ghost danger" data-delgasto="${g.id}">Borrar</button></td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">No hay gastos en ${nombreMes(m)}. Usa el formulario de arriba para anotar el primero.</div>`}
    </section>`;
  },

  /* ===== EQUIPO Y REPARTO ===== */
  equipo(){
    const m = state.mes, cfg = C(), r = resumenMes(m), nm = state.nomina[m] || { pagos: {} };
    const pag = k => !!nm.pagos?.[k];
    const mb = Math.max(0, r.margenBruto), rep = cfg.reparto;
    const lines = [
      ['cm', 'Community manager', r.cm, r.cl.map(c => esc(c.nombre) + ' (' + usd(plan(c.plan).cm) + ')').join(', '), '--chart-mute'],
      ['video', 'Video maker', r.video, `Sueldo fijo · ${pautasActivas()} pautas · ${usdt(costoPautaVideo())} c/u`, '--chart-mute'],
      ['direccion', 'Tu sueldo', mb * rep.direccion / 100, `Dirección y social media · ${rep.direccion}% del margen`, '--chart-2'],
      ['estrategia', 'Estratega', mb * rep.estrategia / 100, `${rep.estrategia}% del margen`, '--chart-1'],
      ['reserva', 'Fondo de reserva', mb * rep.reserva / 100, `${rep.reserva}% del margen · imprevistos y meses flojos`, '--chart-3'],
      ['reinversion', 'Reinversión', mb * rep.reinversion / 100, `${rep.reinversion}% del margen · equipos y publicidad propia`, '--chart-4']
    ];
    const totalPag = lines.reduce((s, l) => s + l[2], 0), hechos = lines.filter(l => pag(l[0])).length;
    pendingCharts.push(() => chart('cReparto', { type: 'doughnut', data: { labels: lines.map(l => l[1]), datasets: [{ data: lines.map(l => +l[2].toFixed(2)), backgroundColor: lines.map(l => css(l[4])), borderWidth: 2, borderColor: css('--surface') }] },
      options: { cutout: '64%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${fmtU(c.parsed)}` } } } } }));
    return `

      <button class="btn pri" type="submit">Confirmar pago</button>
    </div>
    <span class="muted" style="font-size:13px">Debe pagar ${usd(cb.montoBCV)} BCV = ${t ? bs(bsAmt) : '—'} o ${usdt(eqU)}. Si paga en Bs, conviértelos a USDT el mismo día.</span>
  </form>`;
}

/* ---------- eventos ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) { if (state.more && !e.target.closest('#moresheet')) { state.more = false; render(); } return; }
  const d = b.dataset;
  if (d.more !== undefined) { state.more = !state.more; render(); return; }
  if (state.more) state.more = false;
  if (d.tab) { state.tab = d.tab; state.openPago = null; render(); window.scrollTo({ top: 0 }); return; }
  if (d.go) { state.tab = d.go; render(); window.scrollTo({ top: 0 }); return; }
  if (d.mes) { const nm = shiftMes(state.mes, +d.mes); if (nm < inicioMes()) return; state.mes = nm; state.openPago = null; render(); return; }
  if (d.openpay) { state.openPago = state.openPago === d.openpay ? null : d.openpay; render(); return; }
  if (d.unpay) { await Store.del('cobros', cobroId(state.mes, d.unpay)); toast('Pago deshecho'); return; }
  if (d.copy) {
    const c = state.clientes.find(x => x.id === d.copy); if (!c) return;
    const txt = msgCobro(c);
    try { await navigator.clipboard.writeText(txt); toast('Mensaje copiado. Pégalo en WhatsApp.'); }
    catch(err) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Mensaje copiado.'); } catch(e2) { toast('Selecciona y copia el texto manualmente.'); } ta.remove(); }
    return;
  }
  if (d.paynom) {
    const m = state.mes, cur = state.nomina[m] || { pagos: {} }; const pagos = { ...(cur.pagos || {}) }; pagos[d.paynom] = !pagos[d.paynom];
    await Store.set('nomina', m, { mes: m, pagos }); return;
  }
  if (d.userec) {
    const cfg = cfgCopy(); cfg.planes.forEach(p => { if (d.userec === 'all' || d.userec === p.id) { const pp = precioPlan(p); if (pp.lista < pp.recomendado) p.lista = pp.recomendado; } });
    await saveConfig(cfg); toast('Precios actualizados'); return;
  }
  if (d.editcli) { state.editCliente = d.editcli; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (d.canceledit !== undefined) { state.editCliente = null; render(); return; }
  if (d.askdel) { state.confirmDel = d.askdel; render(); return; }
  if (d.canceldel !== undefined) { state.confirmDel = null; render(); return; }
  if (d.delcli) { state.confirmDel = null; await Store.del('clientes', d.delcli); toast('Cliente borrado'); return; }
  if (d.delgasto) { await Store.del('gastos', d.delgasto); toast('Gasto borrado'); return; }
  if (d.deltasa) { await Store.del('tasas', d.deltasa); toast('Tasa borrada'); return; }
  if (d.autotasa !== undefined) {
    b.disabled = true; b.textContent = 'Buscando…';
    try { const r = await Store.call({ action: 'tasasHoy' }); toast(r.nota || 'Tasa de hoy cargada'); }
    catch(err) { toast(err.message === 'clave' ? 'Clave incorrecta' : 'No se pudo traer la tasa: ' + err.message); }
    await Store.refresh(); return;
  }
  if (d.logout !== undefined) { try { localStorage.removeItem('mulato-api'); localStorage.removeItem('mulato-cache'); } catch(e) {} state.mode = 'setup'; render(); return; }
  if (d.addherr !== undefined) { const cfg = cfgCopy(); cfg.herramientas.push({ id: uid().slice(0, 8), nombre: 'Nueva herramienta', monto: 0 }); await saveConfig(cfg); return; }
  if (d.delherr) { const cfg = cfgCopy(); cfg.herramientas.splice(+d.delherr, 1); await saveConfig(cfg); return; }
});

document.addEventListener('change', async e => {
  const el = e.target, d = el.dataset;
  if (d.plan && d.field) { const cfg = cfgCopy(); const p = cfg.planes.find(x => x.id === d.plan); p[d.field] = num(el.value); await saveConfig(cfg); return; }
  if (el.id === 'aInicio') { if (!/^\d{4}-\d{2}$/.test(el.value)) return; const cfg = cfgCopy(); cfg.inicio = mesNum(el.value); if (state.mes < el.value) state.mes = el.value; await saveConfig(cfg); return; }
  if (d.cfg) { const cfg = cfgCopy(); cfg[d.cfg] = num(el.value); await saveConfig(cfg); return; }
  if (d.rep) { const cfg = cfgCopy(); cfg.reparto[d.rep] = num(el.value); await saveConfig(cfg); return; }
  if (d.herr !== undefined) { const cfg = cfgCopy(); const h = cfg.herramientas[+d.herr]; h[d.hf] = d.hf === 'monto' ? num(el.value) : el.value; await saveConfig(cfg); return; }
});
document.addEventListener('input', e => { if (e.target.id === 'cvMonto' || e.target.id === 'cvDe') convert(); });
document.addEventListener('change', e => { if (e.target.id === 'cvDe') convert(); });

function convert(){
  const out = $('#cvOut'); if (!out) return; const t = tasa();
  if (!t) { out.innerHTML = '<p class="muted">Carga una tasa para convertir.</p>'; return; }
  const v = num($('#cvMonto').value), de = $('#cvDe').value;
  const enBs = de === 'bs' ? v : de === 'bcv' ? v * t.bcv : v * t.usdt;
  out.innerHTML = `<div class="line"><span>Bolívares</span><span class="num">${bs(enBs)}</span></div><div class="line"><span>$ BCV</span><span class="num">${usd(enBs / t.bcv)}</span></div><div class="line"><span>USDT</span><span class="num">${usdt(enBs / t.usdt)}</span></div>`;
}

document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target;
  if (f.id === 'setupForm') {
    const url = $('#sUrl').value.trim(), key = $('#sKey').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { state.setupError = 'La URL debe empezar por https://script.google.com/macros/s/…'; render(); return; }
    Store.url = url; Store.key = key; state.setupError = '';
    try { await Store.call({ action: 'all' }); }
    catch(err) { state.setupError = err.code === 'clave' ? 'La clave no coincide con la del Apps Script.' : 'No se pudo conectar. Revisa que la URL sea la de la aplicación web y que el acceso diga "Cualquier usuario".'; render(); return; }
    try { localStorage.setItem('mulato-api', JSON.stringify({ url, key })); } catch(e2) {}
    toast('Conectado'); await Store.start(); return;
  }
  if (f.id === 'tasaForm') {
    const fecha = $('#tFecha').value, bcv = num($('#tBcv').value), us = num($('#tUsdt').value);
    if (!fecha || bcv <= 0 || us <= 0) { toast('Escribe la tasa BCV y la USDT, ambas mayores que cero.'); return; }
    await Store.set('tasas', fecha, { fecha, bcv, usdt: us, fuente: 'manual' }); toast('Tasa guardada'); return;
  }
  if (f.id === 'gastoForm') {
    const t = tasa(), monto = num($('#gMonto').value), mon = $('#gMon').value, fecha = $('#gFecha').value;
    if (monto <= 0) { toast('Escribe un monto mayor que cero.'); return; }
    if (mon === 'bs' && !t) { toast('Carga la tasa del día para convertir bolívares.'); return; }
    const montoUSDT = mon === 'bs' ? monto / t.usdt : monto;
    await Store.set('gastos', uid(), { fecha, mes: mesDe(fecha), categoria: $('#gCat').value, clienteId: $('#gCli').value || null, montoOriginal: monto, moneda: mon, montoUSDT: Math.round(montoUSDT * 100) / 100, nota: $('#gNota').value.trim() });
    toast('Gasto agregado'); return;
  }
  if (f.id === 'cliForm') {
    const nombre = $('#cNom').value.trim(); if (!nombre) { toast('Escribe el nombre del cliente.'); return; }
    const id = f.dataset.id || uid(); const prev = state.clientes.find(c => c.id === id) || {};
    await Store.set('clientes', id, { ...prev, id: undefined, nombre, plan: $('#cPlan').value, pago: $('#cPago').value, estado: $('#cEst').value, telefono: $('#cTel').value.trim(), desde: $('#cDesde').value, orden: prev.orden ?? 50 });
    state.editCliente = null; toast(f.dataset.id ? 'Cambios guardados' : 'Cliente agregado'); render(); return;
  }
  if (f.dataset.payfor) {
    const cid = f.dataset.payfor, c = state.clientes.find(x => x.id === cid), cb = cobroDe(state.mes, c), t = tasa();
    const fv = n => (f.querySelector(`[name="${n}"]`) || {}).value || '';
    const metodo = fv('metodo'), monto = num(fv('monto')), tus = num(fv('tusdt')) || (t ? t.usdt : 0);
    if (monto <= 0) { toast('Escribe el monto recibido.'); return; }
    if (metodo === 'bs' && !tus) { toast('Falta la tasa USDT para convertir los bolívares.'); return; }
    const recibidoUSDT = metodo === 'bs' ? monto / tus : monto;
    await Store.set('cobros', cobroId(state.mes, cid), { mes: state.mes, clienteId: cid, estado: 'pagado', montoBCV: cb.montoBCV, metodo, montoRecibido: monto, tasaUSDT: tus, tasaBCV: t ? t.bcv : null, recibidoUSDT: Math.round(recibidoUSDT * 100) / 100, fechaPago: fv('fecha') || hoy() });
    state.openPago = null; toast('Pago registrado'); render(); return;
  }
});

/* clean undefined id before saving */
const _set = Store.set.bind(Store);
Store.set = (col, id, data) => { const clean = JSON.parse(JSON.stringify(data)); return _set(col, id, clean); };

render();
Store.start();
const _render = render;
render = function(){ _render(); if (state.tab === 'tasas') convert(); };
</script>
</body>
</html>
